background {
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# Time
label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(00FFF0FF)
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(66E0FFCC)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# Greeting / lock icon line
label {
    text =   SYSTEM LOCKED
    color = rgba(00FFF066)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    size = 320, 64
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##00FFF0AA">Enter passphrase</span>
    hide_input = false
    rounding = 0
    outer_color = rgba(00FFF0FF)
    inner_color = rgba(00141AEE)
    font_color = rgba(CFFFFFFF)
    check_color = rgba(00FFF0FF)
    fail_color = rgba(FF2D55FF)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -120
    halign = center
    valign = center
}
